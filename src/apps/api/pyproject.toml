[project]
name = "ana-api"
version = "0.1.0"
description = "Backend da Ana (ver docs/dev/architecture/03-backend.md)"
authors = [
    { name = "fc9", email = "fabiocabralx@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.139.0",
    "pydantic-settings>=2.14.2",
    "redis>=5",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
